<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FastFoods</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fff;
            color: #333;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #800000;
            color: #fff;
            padding: 10px;
            text-align: center;
        }
        nav {
            background-color: #800000;
            padding: 10px 0;
            text-align: center;
        }
        nav ul {
            list-style-type: none;
            margin: 0;
            padding: 0;
        }
        nav ul li {
            display: inline;
            margin-right: 20px;
        }
        nav ul li a {
            color: #fff;
            text-decoration: none;
        }
        nav ul li a:hover {
            color: #800000;
        }
        .kitchen {
            margin: 30px auto;
            max-width: 500px;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .kitchen h2 {
            text-align: center;
            color: #800000;
        }
        .slideshow-container {
            position: relative;
            margin: auto;
        }
        .product {
            display: none;
            text-align: center;
        }
        .product img {
            width: 100%;
            height: auto;
            border-radius: 10px;
            aspect-ratio: 1;
        }
        .prev, .next {
            cursor: pointer;
            position: absolute;
            top: 50%;
            width: auto;
            padding: 16px;
            margin-top: -22px;
            color: white;
            font-weight: bold;
            font-size: 18px;
            transition: 0.6s ease;
            border-radius: 0 3px 3px 0;
            user-select: none;
            background-color: rgba(0,0,0,0.5);
        }
        .next {
            right: 0;
            border-radius: 3px 0 0 3px;
        }
        .prev:hover, .next:hover {
            background-color: rgba(0,0,0,0.8);
        }
        footer {
            background-color: #800000;
            color: #fff;
            padding: 10px;
            text-align: center;
        }
    </style>
</head>
<body>
    <header>
        <h1>Fast Foods</h1>
        <nav>
            <ul>
                <li><a href="https://setsing.vercel.app/">Home</a></li>
                <li><a href="https://setsing-git-services-setsings-projects.vercel.app/">Services</a></li>
            </ul>
        </nav>
    </header>

    <h3 style="text-align: center;">Choose a Kitchen</h3>

    <!-- Ko Dijon Kitchen -->
    <div class="kitchen">
        <h2>Ko Dijon</h2>
        <div class="slideshow-container">
            <div class="product mySlides">
                <a href="YOUR_DROPBOX_FORM_LINK_HERE">
                    <img src="https://github.com/Electrorex2025/Setsing/blob/Pictures/SkhambaneEsw.png?raw=true" alt="Beef Stew">
                    <h3>Beef Stew - R60</h3>
                </a>
            </div>
            <div class="product mySlides">
                <a href="YOUR_DROPBOX_FORM_LINK_HERE">
                    <img src="https://github.com/Electrorex2025/Setsing/blob/Pictures/BeefBurger.jpg?raw=true" alt="Grilled Beef">
                    <h3>Grilled Beef - R50</h3>
                </a>
            </div>
            <div class="product mySlides">
                <a href="YOUR_DROPBOX_FORM_LINK_HERE">
                    <img src="https://github.com/Electrorex2025/Setsing/blob/Pictures/Dagwood.png?raw=true" alt="Ox Liver">
                    <h3>Ox Liver - R35</h3>
                </a>
            </div>
            <a class="prev" onclick="plusSlides(-1, this.parentNode)">&#10094;</a>
            <a class="next" onclick="plusSlides(1, this.parentNode)">&#10095;</a>
        </div>
    </div>

    <!-- Thandy's Kitchen -->
    <div class="kitchen">
        <h2>Thandy's Kitchen</h2>
        <div class="slideshow-container">
            <div class="product mySlides">
                <a href="YOUR_DROPBOX_FORM_LINK_HERE">
                    <img src="https://github.com/Electrorex2025/Setsing/blob/Pictures/SkhambaneEsw.png?raw=true" alt="Pork">
                    <h3>Pork - R140</h3>
                </a>
            </div>
            <div class="product mySlides">
                <a href="YOUR_DROPBOX_FORM_LINK_HERE">
                    <img src="https://github.com/Electrorex2025/Setsing/blob/Pictures/BeefBurger.jpg?raw=true" alt="Small Chips">
                    <h3>Small Chips - R15</h3>
                </a>
            </div>
            <div class="product mySlides">
                <a href="YOUR_DROPBOX_FORM_LINK_HERE">
                    <img src="https://github.com/Electrorex2025/Setsing/blob/Pictures/Dagwood.png?raw=true" alt="Large Chips">
                    <h3>Large Chips - R30</h3>
                </a>
            </div>
            <a class="prev" onclick="plusSlides(-1, this.parentNode)">&#10094;</a>
            <a class="next" onclick="plusSlides(1, this.parentNode)">&#10095;</a>
        </div>
    </div>

    <!-- ADD MORE KITCHENS HERE LATER (COPY-PASTE ABOVE DIV) -->

    <footer>
        <p>&copy; 2025 SetsingEscrow</p>
    </footer>

    <script>
        // Initialize all slideshows
        document.querySelectorAll('.slideshow-container').forEach(container => {
            showSlides(1, container);
        });

        function plusSlides(n, container) {
            showSlides(getCurrentSlide(container) + n, container);
        }

        function getCurrentSlide(container) {
            const slides = container.querySelectorAll('.mySlides');
            for (let i = 0; i < slides.length; i++) {
                if (slides[i].style.display === 'block') {
                    return i + 1;
                }
            }
            return 1;
        }

        function showSlides(n, container) {
            const slides = container.querySelectorAll('.mySlides');
            if (n > slides.length) { n = 1 }
            if (n < 1) { n = slides.length }
            for (let i = 0; i < slides.length; i++) {
                slides[i].style.display = 'none';
            }
            slides[n - 1].style.display = 'block';
        }
    </script>
</body>
</html>
