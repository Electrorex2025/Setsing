<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thandy's Kitchen - Order</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 800px;
            margin: 20px auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .kitchen-header {
            text-align: center;
            margin-bottom: 20px;
        }
        .kitchen-header img {
            width: 100%;
            max-height: 300px;
            object-fit: cover;
            border-radius: 8px;
        }
        .kitchen-header h1 {
            color: #800000;
            margin-top: 10px;
        }
        .delivery-note {
            background: #FFF8E1;
            padding: 10px;
            border-left: 4px solid #FFC107;
            margin-bottom: 20px;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        select, input, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 16px;
            margin-bottom: 10px;
        }
        .item-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        .item-row select {
            flex: 3;
        }
        .item-row input {
            flex: 1;
        }
        .total-section {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            text-align: right;
            font-size: 18px;
            font-weight: bold;
        }
        .submit-btn {
            background-color: #25D366;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .submit-btn:hover {
            background-color: #128C7E;
        }
        .whatsapp-icon {
            margin-right: 10px;
            font-size: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="kitchen-header">
            <img src="https://via.placeholder.com/800x300?text=Thandy's+Kitchen" alt="Thandy's Kitchen">
            <h1>Thandy's Kitchen</h1>
        </div>

        <div class="delivery-note">
            Note: Delivery fees will be calculated by the supplier based on your location.
        </div>

        <form id="orderForm">
            <div class="form-group">
                <label for="customerName">Your Name*:</label>
                <input type="text" id="customerName" required>
            </div>

            <div class="form-group">
                <label for="deliveryAddress">Delivery Address*:</label>
                <textarea id="deliveryAddress" rows="3" required></textarea>
            </div>

            <h3>Select Your Items:</h3>
            
            <!-- Item 1 -->
            <div class="item-row">
                <select class="food-item" id="item1" onchange="calculateTotal()">
                    <option value="0">-- Select item --</option>
                    <option value="60">Beef stew - R60</option>
                    <option value="45">Chicken curry - R45</option>
                    <option value="50">Grilled chicken - R50</option>
                    <option value="50">Grilled Beef - R50</option>
                    <option value="45">Grilled pork - R45</option>
                    <option value="40">Cooked Turkey - R40</option>
                    <option value="35">Ox liver - R35</option>
                    <option value="50">Nama ya hlooho ya kgomo - R50</option>
                    <option value="40">Grilled Pork - R40</option>
                    <option value="40">Tlhakwana ya kgomo - R40</option>
                    <option value="40">Pork trotters with moroho, chakalaka and pap - R40</option>
                </select>
                <input type="number" min="1" value="1" class="quantity" id="qty1" onchange="calculateTotal()">
            </div>

            <!-- Item 2 -->
            <div class="item-row">
                <select class="food-item" id="item2" onchange="calculateTotal()">
                    <option value="0">-- Select item --</option>
                    <option value="60">Beef stew - R60</option>
                    <option value="45">Chicken curry - R45</option>
                    <!-- Same options as above -->
                </select>
                <input type="number" min="1" value="1" class="quantity" id="qty2" onchange="calculateTotal()">
            </div>

            <!-- Item 3 -->
            <div class="item-row">
                <select class="food-item" id="item3" onchange="calculateTotal()">
                    <option value="0">-- Select item --</option>
                    <option value="60">Beef stew - R60</option>
                    <option value="45">Chicken curry - R45</option>
                    <!-- Same options as above -->
                </select>
                <input type="number" min="1" value="1" class="quantity" id="qty3" onchange="calculateTotal()">
            </div>

            <div class="total-section">
                Total: R<span id="totalAmount">0.00</span> (excluding delivery)
            </div>

            <button type="button" class="submit-btn" onclick="submitToWhatsApp()">
                <span class="whatsapp-icon">📱</span> Send Order via WhatsApp
            </button>
        </form>
    </div>

    <script>
        function calculateTotal() {
            let total = 0;
            for (let i = 1; i <= 3; i++) {
                const item = document.getElementById(`item${i}`);
                const qty = document.getElementById(`qty${i}`);
                if (item && qty) {
                    total += parseFloat(item.value) * parseInt(qty.value);
                }
            }
            document.getElementById('totalAmount').textContent = total.toFixed(2);
        }

        function submitToWhatsApp() {
            const name = document.getElementById('customerName').value;
            const address = document.getElementById('deliveryAddress').value;
            
            if (!name || !address) {
                alert("Please enter your name and delivery address");
                return;
            }

            let orderItems = [];
            for (let i = 1; i <= 3; i++) {
                const item = document.getElementById(`item${i}`);
                const qty = document.getElementById(`qty${i}`);
                if (item.value !== "0") {
                    orderItems.push(`${qty.value}x ${item.options[item.selectedIndex].text}`);
                }
            }

            if (orderItems.length === 0) {
                alert("Please select at least one item");
                return;
            }

            const total = document.getElementById('totalAmount').textContent;
            
            const message = `*NEW ORDER - Thandy's Kitchen*\n\n` +
                            `*Name:* ${name}\n` +
                            `*Delivery Address:* ${address}\n\n` +
                            `*Order:*\n${orderItems.join('\n')}\n\n` +
                            `*Subtotal:* R${total} (excl. delivery)\n\n` +
                            `_Note: Delivery fee to be calculated based on location_`;

            const whatsappUrl = `https://wa.me/2763336438?text=${encodeURIComponent(message)}`;
            window.open(whatsappUrl, '_blank');
        }
    </script>
</body>
</html>
